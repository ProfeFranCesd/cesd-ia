<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CESD · Transparencia IA</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { theme: { extend: { colors: { ink: '#17212b', navy: '#24445f', paper: '#f5f7f8', line: '#d9e0e5' } } } }
  </script>
  <style>button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid #8db9d8;outline-offset:2px}</style>
</head>
<body class="min-h-screen bg-paper text-ink font-sans">
  <main class="mx-auto flex min-h-screen w-full max-w-7xl flex-col gap-6 p-4 sm:p-8">
    <header class="flex flex-col gap-4 border-b border-line pb-5 lg:flex-row lg:items-end lg:justify-between">
      <div><p class="text-xs font-bold uppercase tracking-[.18em] text-navy">CESD · Transparencia IA</p><h1 class="mt-2 text-2xl font-bold tracking-tight sm:text-3xl">Sistema de declaraciones de uso de Inteligencia Artificial</h1><p class="mt-1 text-sm text-slate-600">Prototipo independiente para estudiantes, docentes y verificadores.</p></div>
      <nav id="nav" class="flex flex-wrap gap-1 rounded-xl border border-line bg-white p-1 shadow-sm" aria-label="Vistas"></nav>
    </header>
    <div id="app"></div>
  </main>
<script>
const students=[['Juan Pérez','JP','Sí','ChatGPT','🟡','Colaboradora','amber'],['Sofía Rodríguez','SR','Sí','Gemini','🟢','Asistente','emerald'],['Mateo González','MG','No','—','⚪','Sin uso','slate'],['Valentina López','VL','Sí','Copilot','🔴','Generadora','rose'],['Tomás Fernández','TF','Sí','ChatGPT','🟢','Asistente','emerald']];
const levels=[['assistant','🟢','Asistente','apoyo, dudas, corrección'],['collaborator','🟡','Colaboradora','participación activa, co-creación'],['generator','🔴','Generadora','gran parte del producto final']];
const tools=['ChatGPT','Gemini','Copilot','Otra'];
const purposes=['Generar ideas','Explicar conceptos','Generar código','Corregir código','Crear texto','Crear imágenes','Analizar información','Otro'];
let view='form';
const tone={emerald:'bg-emerald-50 text-emerald-700 ring-emerald-200',amber:'bg-amber-50 text-amber-800 ring-amber-200',rose:'bg-rose-50 text-rose-700 ring-rose-200',slate:'bg-slate-100 text-slate-600 ring-slate-200'};
function nav(){document.querySelector('#nav').innerHTML=[['form','Declarar Uso'],['badge','Sello & QR'],['config','Configurar Tarea'],['dashboard','Panel Docente'],['verify','Verificar Sello']].map(x=>`<button onclick="show('${x[0]}')" class="rounded-lg px-3 py-2 text-xs font-semibold ${view===x[0]?'bg-navy text-white':'text-slate-600 hover:bg-slate-100'}">${x[1]}</button>`).join('')}
function show(v){view=v;nav();document.querySelector('#app').innerHTML=views[v]();}
function field(label,html){return `<section><h2 class="mb-3 text-sm font-bold">${label}</h2>${html}</section>`}
function form(){return `<section class="mx-auto flex w-full max-w-2xl flex-col gap-6 rounded-2xl border border-line bg-white p-5 shadow-sm sm:p-7"><header class="border-b border-line pb-5"><div class="flex items-center gap-3"><span class="text-2xl">🤖</span><div><p class="text-xs font-bold uppercase tracking-[.15em] text-navy">CESD · Transparencia IA</p><h2 class="mt-1 text-xl font-bold">Declaración de uso de Inteligencia Artificial</h2></div></div></header>${field('Nivel de uso de IA',`<div class="grid gap-3">${levels.map((x,i)=>`<button onclick="selectCard(this)" class="option flex items-start gap-4 rounded-xl border-2 ${i===1?'border-navy bg-slate-50':'border-line'} p-4 text-left"><span class="text-2xl">${x[1]}</span><span><b>${x[2]}</b><small class="mt-1 block text-xs text-slate-500">${x[3]}</small></span><span class="radio ml-auto mt-1"></span></button>`).join('')}</div>`)}${field('Herramientas utilizadas',`<div class="flex flex-wrap gap-2">${tools.map((x,i)=>`<button onclick="toggle(this)" class="check rounded-lg ${i===0?'bg-navy text-white':'border border-line'} px-3 py-2 text-xs font-semibold">${i===0?'✓ ':''}${x}</button>`).join('')}</div>`)}${field('Finalidad del uso',`<div class="grid grid-cols-2 gap-2">${purposes.map((x,i)=>`<button onclick="toggle(this)" class="check rounded-lg ${i<2?'bg-navy text-white':'border border-line'} px-3 py-2 text-left text-xs font-semibold">${i<2?'✓ ':''}${x}</button>`).join('')}</div>`)}<label class="text-sm font-bold">¿Qué parte del trabajo realizaste o modificaste vos?<textarea class="mt-2 min-h-24 w-full rounded-lg border border-line px-3 py-2 text-sm" placeholder="Describí tu aporte específico..."></textarea></label><button onclick="alert('Declaración registrada correctamente.')" class="w-full rounded-lg bg-navy px-4 py-3 font-bold text-white hover:opacity-90">Confirmar y Declarar</button></section>`}
function badge(){return `<section class="mx-auto w-full max-w-2xl rounded-2xl border-2 border-dashed border-emerald-300 bg-emerald-50 p-5 sm:p-7"><div class="flex items-start justify-between gap-3"><h2 class="text-lg font-black text-emerald-950">🤖 SELLO DE TRANSPARENCIA IA</h2><span class="rounded-full bg-emerald-200 px-3 py-1 text-xs font-bold text-emerald-950">✓ Verificado</span></div><div class="mt-5 grid gap-4 rounded-xl bg-white p-5"><div><small class="label">ESTUDIANTE</small><p class="mt-1 text-xl font-bold">Juan Pérez</p></div><div class="grid gap-4 sm:grid-cols-2"><div><small class="label">CURSO & ACTIVIDAD</small><p class="mt-1 font-semibold">5° Año · Proyecto Arduino</p></div><div><small class="label">FECHA</small><p class="mt-1 font-semibold">27/08/2026</p></div></div><div><small class="label">NIVEL</small><p class="mt-2 inline-block rounded-full bg-amber-100 px-3 py-1.5 text-sm font-bold text-amber-900">🟡 IA Colaboradora</p></div><div><small class="label">HERRAMIENTA</small><p class="mt-1 font-semibold">ChatGPT</p></div><div class="flex items-end justify-between gap-3 border-t border-line pt-4"><div><small class="label">ID ÚNICO</small><code class="mt-1 block font-mono text-lg font-black">CESD-IA-000184</code></div><button onclick="navigator.clipboard?.writeText('CESD-IA-000184');this.textContent='Copiado'" class="rounded-lg border border-line px-3 py-2 text-xs font-semibold">Copiar</button></div><div class="flex items-center gap-4"><svg role="img" aria-label="Código QR de verificación" viewBox="0 0 120 120" class="size-28 rounded border border-line bg-white p-2"><rect width="120" height="120" fill="white"/><g fill="#17212b"><path d="M8 8h34v34H8zM14 14v22h22V14zM21 21h8v8h-8zM78 8h34v34H78zM84 14v22h22V14zM91 21h8v8h-8zM8 78h34v34H8zM14 84v22h22V84zM21 91h8v8h-8zM52 8h8v8h-8zM62 8h8v18h-8zM48 28h12v8H48zM68 32h8v12h-8zM48 48h8v8h-8zM60 48h8v8h-8zM72 48h8v8h-8zM88 48h8v8h-8zM104 48h8v8h-8zM48 60h8v8h-8zM60 60h20v8H60zM88 60h8v8h-8zM100 60h12v8h-12zM48 72h20v8H48zM76 72h8v20h-8zM88 72h8v8h-8zM100 72h12v8h-12zM48 88h8v24h-8zM60 88h8v8h-8zM88 88h8v8h-8zM100 88h8v8h-8zM60 100h20v12H60zM88 104h24v8H88z"/></g></svg><div class="text-xs text-slate-500"><b>Firma SHA-256:</b><code class="mt-1 block font-mono">8f4a...e921</code><b class="mt-3 block">URL:</b><code class="break-all font-mono">transparencia.cesd.edu.ar/ver/CESD-IA-000184</code></div></div></div></section>`}
function config(){return `<section class="mx-auto flex w-full max-w-2xl flex-col gap-6 rounded-2xl border border-line bg-white p-5 shadow-sm sm:p-7"><header class="border-b border-line pb-5"><p class="text-xs font-bold uppercase tracking-[.15em] text-navy">CESD Transparencia IA</p><h2 class="mt-2 text-2xl font-bold">Configurar Actividad</h2><p class="mt-1 text-sm text-slate-500">Establece las condiciones de uso de IA para esta tarea.</p></header>${field('Condiciones de uso de IA',`<div class="grid gap-2">${[['🚫','IA no permitida','Producción 100% individual.'],['🟢','Permitida únicamente como Asistente','Dudas, corrección de texto/código.'],['🟡','Permitida como Colaboradora','Co-creación con revisión obligatoria.'],['🔴','Permitida como Generadora','Requiere defensa y explicación detallada.'],['🔓','Permitida libremente','Declaración obligatoria.']].map((x,i)=>`<button onclick="selectCard(this)" class="option flex items-start gap-4 rounded-lg border-2 ${i===2?'border-navy bg-slate-50':'border-line'} p-4 text-left"><span class="text-xl">${x[0]}</span><span class="flex-1"><b>${x[1]}</b><small class="mt-1 block text-xs text-slate-500">${x[2]}</small></span><span class="radio mt-1"></span></button>`).join('')}</div>`)}<label class="flex gap-3 rounded-lg border border-line p-4 text-sm"><input type="checkbox" checked class="mt-1 accent-navy"><span><b>Exigir Sello de Transparencia</b><small class="mt-1 block text-xs text-slate-500">para dar por entregada la tarea</small></span></label><button onclick="alert('Configuración guardada.')" class="w-full rounded-lg bg-navy px-4 py-3 font-bold text-white">Guardar Configuración de Tarea</button></section>`}
function dashboard(){return `<section class="flex flex-col gap-6"><header><p class="text-xs font-bold uppercase tracking-[.15em] text-navy">CESD · Transparencia IA</p><h2 class="mt-2 text-3xl font-bold">Panel de uso de IA</h2><p class="mt-1 text-sm text-slate-500">5° Año - Programación y Robótica</p></header><div class="grid grid-cols-2 gap-3 lg:grid-cols-5">${[['Total entregas','32','100% del curso'],['🟢 Asistente','14','44%'],['🟡 Colaboradora','12','37%'],['🔴 Generadora','4','13%'],['⚪ Sin uso de IA','2','6%']].map(x=>`<div class="rounded-2xl border border-line bg-white p-4 shadow-sm"><span class="text-xs font-medium text-slate-500">${x[0]}</span><b class="mt-3 block text-2xl">${x[1]}</b><small class="text-xs text-slate-500">${x[2]}</small></div>`).join('')}</div><div class="overflow-hidden rounded-2xl border border-line bg-white shadow-sm"><div class="border-b border-line p-4"><h3 class="font-bold">Declaraciones recientes</h3><input oninput="filterRows(this.value)" class="mt-3 w-full rounded-lg border border-line px-3 py-2 text-sm sm:mt-0 sm:ml-4 sm:w-52" placeholder="Buscar estudiante"></div><div class="overflow-x-auto"><table class="w-full min-w-[760px] text-left text-sm"><thead class="bg-slate-50 text-[11px] uppercase tracking-wider text-slate-500"><tr>${['Estudiante','Uso de IA','Herramienta','Nivel','Estado declaración','Acciones'].map(x=>`<th class="px-4 py-3">${x}</th>`).join('')}</tr></thead><tbody id="rows" class="divide-y divide-line">${rows()}</tbody></table></div></div></section>`}
function rows(){return students.map(s=>`<tr class="student-row hover:bg-slate-50"><td class="px-4 py-3"><div class="flex items-center gap-3"><span class="flex size-8 items-center justify-center rounded-full bg-slate-100 text-xs font-bold text-navy">${s[1]}</span><b>${s[0]}</b></div></td><td class="px-4 py-3"><span class="rounded-full px-2.5 py-1 text-xs font-semibold ${s[2]==='Sí'?'bg-emerald-50 text-emerald-700':'bg-slate-100 text-slate-500'}">${s[2]}</span></td><td class="px-4 py-3 text-slate-500">${s[3]}</td><td class="px-4 py-3"><span class="rounded-full px-2.5 py-1 text-xs font-semibold ring-1 ${tone[s[6]]}">${s[4]} ${s[5]}</span></td><td class="px-4 py-3 text-xs font-semibold text-emerald-700">✅ Verificada</td><td class="px-4 py-3"><button onclick="show('badge')" class="rounded-lg border border-line px-3 py-2 text-xs font-semibold">Ver Sello / QR</button></td></tr>`).join('')}
function verify(){return `<section class="mx-auto flex w-full max-w-2xl flex-col gap-5"><div class="rounded-2xl border border-emerald-200 bg-emerald-50 p-5 text-center"><p class="text-xs font-bold uppercase tracking-wider text-emerald-800">CESD · Centro Educativo</p><h2 class="mt-4 text-2xl font-black text-emerald-950">Declaración Verificada Oficialmente ✅</h2></div><article class="rounded-2xl border border-line bg-white p-5 shadow-sm sm:p-7"><h3 class="border-b border-line pb-4 text-lg font-bold">Detalle de la declaración</h3><dl class="mt-5 grid gap-4">${[['Estudiante','Juan Pérez'],['Curso','5° Año Tecnológico'],['Tarea','Proyecto Arduino & Sensores'],['Fecha de Entrega','27 de Agosto de 2026, 14:30 hs'],['Nivel declarado','🟡 IA Colaboradora'],['Herramienta','ChatGPT'],['Uso declarado','Generación del sketch inicial de Arduino y depuración de errores de sintaxis en el bucle principal.'],['Aporte del estudiante','Modifiqué las asignaciones de pines, agregué la lectura del sensor ultrasónico y reescribí la lógica de control.']].map(x=>`<div><dt class="text-xs font-bold uppercase tracking-wider text-slate-500">${x[0]}</dt><dd class="mt-1 font-medium">${x[1]}</dd></div>`).join('')}</dl><div class="mt-6 rounded-xl bg-slate-50 p-4"><h3 class="font-bold">Seguridad y autenticidad</h3><dl class="mt-3 grid gap-2 text-sm"><div><dt class="text-slate-500">Unique ID</dt><dd class="font-mono font-bold">CESD-IA-000184</dd></div><div><dt class="text-slate-500">SHA-256 Hash Signature</dt><dd class="font-mono">a94f8e...3b12</dd></div><div><dt class="text-slate-500">Timestamp</dt><dd class="font-mono">2026-08-27T17:30:00Z</dd></div></dl></div></article></section>`}
const views={form,badge,config,dashboard,verify};
function toggle(el){el.classList.toggle('bg-navy');el.classList.toggle('text-white');el.classList.toggle('border');el.classList.toggle('border-line');el.textContent=el.textContent.startsWith('✓')?el.textContent.slice(2):'✓ '+el.textContent}
function selectCard(el){document.querySelectorAll('.option').forEach(x=>{x.classList.remove('border-navy','bg-slate-50');x.classList.add('border-line')});el.classList.add('border-navy','bg-slate-50')}
function filterRows(q){document.querySelectorAll('.student-row').forEach(r=>r.hidden=!r.textContent.toLowerCase().includes(q.toLowerCase()))}
nav();show('form');
</script>
</body></html>
